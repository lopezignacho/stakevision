name: Vista previa noticia - prueba
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: stakevision-state
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: mkdir -p data/probe && (python tools/news_render_probe.py 2>&1 | tee data/probe/newsrender-run.txt) || true
      - run: |
          git config user.name "stakevision-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/probe/newsrender data/probe/newsrender-run.txt
          git commit -m "prueba vista noticia" || echo "sin cambios"
          git pull --rebase && git push
