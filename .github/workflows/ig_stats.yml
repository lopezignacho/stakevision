name: Instagram - estadísticas
on: workflow_dispatch
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/ig_stats.py || true
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      - run: |
          git config user.name "stakevision-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/probe/igstats.json && git commit -m "estadísticas instagram" || echo "sin cambios"
          git pull --rebase && git push
