name: Sondeo NBA (solo lectura)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/probe_nba.py | tee probe.txt
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            probe.txt
            data/markets_basketball.json
