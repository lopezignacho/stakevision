name: Sondeo NBA (solo lectura)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/probe_nba.py | tee probe.txt
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      - run: |
          mkdir -p data/probe && mv probe.txt data/probe/nba.txt
          git config user.name "stakevision-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/probe data/markets_basketball.json
          git commit -m "sondeo NBA" || echo "sin cambios"
          git pull --rebase && git push
