name: NBA de hoy - prueba
on:
  workflow_dispatch:
    inputs:
      equipo:
        description: "Equipo"
        default: "Atalanta"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          MATCH_TEAM: ${{ github.event.inputs.equipo }}
        run: mkdir -p data/probe && (python tools/nba_today_probe.py 2>&1 | tee data/probe/nba-today-run.txt) || true
      - if: always()
        run: |
          git config user.name "stakevision-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/probe
          git commit -m "prueba nba hoy" || echo "sin cambios"
          git pull --rebase && git push
