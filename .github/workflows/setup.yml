name: Preparar (una vez)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stakevision-state
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Descargar mercados y revisar cuota
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m sv.main setup
      - name: Guardar
        run: |
          git config user.name "stakevision-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Mercados de fútbol" && git push)
