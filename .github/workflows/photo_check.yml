name: Fotos - revisión con datos reales
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/photo_check.py
      - run: |
          git config user.name "stakevision-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf data/probe/root && git add data/probe
          git commit -m "revisión fotos" || echo "sin cambios"
          git pull --rebase && git push
