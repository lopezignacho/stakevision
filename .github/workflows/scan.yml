name: Escaneo diario

on:
  schedule:
    # 12:07 UTC = 09:07 en Chile (horario de verano, UTC-3)
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      horas:
        description: "Horas hacia adelante a analizar (30 normal, máx. 47)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: stakevision-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar valor y enviar candidatos
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          LINK_CODE: ${{ secrets.LINK_CODE }}
          SCAN_HOURS: ${{ github.event.inputs.horas }}
        run: python -m sv.main scan
      - name: Guardar estado
        run: |
          git config user.name "stakevision-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/historial.json
          git diff --cached --quiet || (git commit -m "Escaneo $(date -u +%F)" && git pull --rebase && git push)
