name: Postpartido campeon - prueba
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: stakevision-state
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PID: "296"
          TITLE: "¡COLO-COLO CAMPEÓN!"
          DATO: "Estrella 35 · Bolados lo ganó en el 90'+2'"
          CHAMP: "CAMPEÓN 2026"
        run: mkdir -p data/probe && (python tools/champ_probe.py 2>&1 | tee data/probe/champ-run.txt) || true
      - run: |
          git config user.name "stakevision-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/probe/champ data/probe/champ-run.txt
          git commit -m "prueba campeon" || echo "sin cambios"
          git pull --rebase && git push
