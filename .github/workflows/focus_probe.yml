name: Encuadre - prueba
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: mkdir -p data/probe && (python tools/focus_probe.py 2>&1 | tee data/probe/focus-run.txt) || true
      - if: always()
        run: |
          git config user.name "stakevision-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf data/probe/root && git add data/probe
          git commit -m "prueba encuadre" || echo "sin cambios"
          git pull --rebase && git push
